apiVersion: apps/v1
kind: Deployment 
metadata: 
  name: pedidos-v1
  namespace: servicemesh
  labels: 
    app: pedidos
    version: v1
spec: 
  replicas: 2
  selector: 
    matchLabels:
      app: pedidos
      version: v1
  template: 
    metadata:
      labels: 
        app: pedidos
        version: v1
    spec:
      containers:
      - name: pedidos
        image: pedidos-service:v1
        ports:
        - containerPort: 8000
---
apiVersion: v1
kind: Service 
metadata: 
  name: pedidos-service
  namespace: servicemesh
spec:
  selector:
    app: pedidos
  ports:
  - port: 80
    targetPort: 8000